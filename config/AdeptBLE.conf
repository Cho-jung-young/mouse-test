CONFIG_ZMK_KEYBOARD_NAME="AdeptBLE"

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_GPIO=y

# CONFIG_ZMK_EXT_POWER=y

# PMW3610 Driver
CONFIG_PINCTRL=y
CONFIG_PMW3610=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# CONFIG_PMW3610_INIT_RETRY_COUNT=50
# CONFIG_PMW3610_INIT_RETRY_DELAY_MS=100

CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ---------------------------------------------------------
# Holyiot 22046 (nRF52840 Dongle 타겟) 전용 무선 동글 수신기 설정
# ---------------------------------------------------------
#if BOARD_NRF52840DONGLE_NRF52840

    # 1. 동글을 센트럴(Central/수신기)로 지정하여 마우스 본체(Xiao BLE)의 신호를 받도록 합니다.
    CONFIG_ZMK_SPLIT=y
    CONFIG_ZMK_SPLIT_BLE_ROLE_CENTRAL=y

    # 2. 블루투스 동시 연결 수 조정 (동글-PC연결 및 본체 무선 수신 최적화)
    CONFIG_BT_MAX_CONN=2
    CONFIG_BT_MAX_PAIRED=2

    # 3. 배터리 소모 및 통신 안정성 최적화
    CONFIG_ZMK_SPLIT_BLE_PREF_INT_MIN=6
    CONFIG_ZMK_SPLIT_BLE_PREF_INT_MAX=12
    
    # 4. 동글은 상시 구동되어야 하므로 절전 딥슬립을 방지합니다.
    CONFIG_ZMK_SLEEP=n

#endif
