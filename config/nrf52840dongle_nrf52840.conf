CONFIG_ZMK_KEYBOARD_NAME="AdeptBLE Dongle"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# 1. 제약 없는 순정 부트로더 주소(0x1000)를 쓰도록 강제 지정합니다
CONFIG_BOARD_NRF52840DONGLE_NRF52840=y

# 2. Holyiot 내부 시계(RC)를 사용해 무선 박자를 맞춥니다
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# 3. 컴퓨터에게 동글이가 트랙볼 센서(PMW3610) 데이터를 다룰 거라고 알려줍니다
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
